# Ambiente local do Lotou. Suba pela raiz: `make up` ou `docker compose up`.
#
# Portas publicadas no host:
#   4200  loja (Angular)             8080  api-gateway
#   8180  Keycloak                   3000  Grafana (Tempo, Prometheus e Loki)
#   5432  Postgres                   27017 MongoDB
#   6379  redis-cache                6380  redis-core
#   4317/4318  OTel Collector (OTLP gRPC e HTTP)
#   9094  Kafka (do host)            8090  Kafka UI
#
# As credenciais abaixo são de desenvolvimento. Para trocá-las, crie um arquivo
# .env na raiz (veja .env.example).

# Destino da telemetria, igual para todos os serviços.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=lotou,deployment.environment.name=local

# Validação do JWT, igual para todos os serviços. O emissor é a URL pública do
# realm (a que aparece no token); as chaves são baixadas pela rede interna.
x-auth-env: &auth-env
  AUTH_ISSUER: http://localhost:8180/realms/lotou
  AUTH_JWKS_URI: http://keycloak:8080/realms/lotou/protocol/openid-connect/certs
  AUTH_AUDIENCE: lotou-api
  # Onde um serviço busca o token da sua conta de serviço (client credentials).
  AUTH_TOKEN_URI: http://keycloak:8080/realms/lotou/protocol/openid-connect/token

services:
  # ------------------------------------------------------------- aplicação
  # Loja (Angular) servida por nginx, que também encaminha /api ao gateway e
  # /otlp ao Collector: tudo no mesmo domínio para o navegador.
  web:
    build:
      context: ../apps/web
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Porta de entrada da API: roteia para os serviços e valida o JWT.
  api-gateway:
    build:
      context: ../services/api-gateway
    environment:
      <<: [*otel-env, *auth-env]
      OTEL_SERVICE_NAME: api-gateway
      REDIS_URL: redis://redis-core:6379
      EVENT_SERVICE_URL: http://event-service:3000
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
    ports:
      - "8080:8080"
    depends_on:
      event-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Sem porta publicada: só o api-gateway fala com ele.
  event-service:
    build:
      context: ../services/event-service
    environment:
      <<: [*otel-env, *auth-env]
      OTEL_SERVICE_NAME: event-service
      PORT: "3000"
      # Replica set: o show e o outbox são gravados na mesma transação.
      MONGODB_URI: mongodb://mongodb:27017/event_service?replicaSet=rs0
      # Cache da página e da busca (pode perder dados) e rate limit das leituras.
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_CORE_URL: redis://redis-core:6379
      SHOW_CACHE_ENABLED: ${SHOW_CACHE_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Publica shows.catalog (pelo outbox) e consome inventory.events.
      KAFKA_BROKERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Lotes, disponibilidade, reservas e fila virtual. Lê o catálogo de shows.catalog, recebe os
  # comandos da saga e publica os fatos de reservas e lotes em inventory.events.
  inventory-service:
    build:
      context: ../services/inventory-service
    environment:
      <<: [*otel-env, *auth-env]
      OTEL_SERVICE_NAME: inventory-service
      DATABASE_URL: jdbc:postgresql://postgres:5432/inventory
      DATABASE_USERNAME: inventory
      DATABASE_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis-core:6379
      # redis (fase 2) ou postgres (fase 1): o teste de carga compara os dois (ADR 3).
      RESERVATION_ENGINE: ${RESERVATION_ENGINE:-redis}
      QUEUE_ADMISSION_RATE: ${QUEUE_ADMISSION_RATE:-100}
      # Chave do HMAC do CPF. A de desenvolvimento não serve para um ambiente real.
      CPF_HASH_KEY: ${CPF_HASH_KEY:-lotou-dev-cpf-hash-key}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis-core:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Pedidos e ingressos. Orquestra a saga de compra pelo Kafka; lê a reserva no inventory-service.
  order-service:
    build:
      context: ../services/order-service
    environment:
      <<: [*otel-env, *auth-env]
      OTEL_SERVICE_NAME: order-service
      DATABASE_URL: jdbc:postgresql://postgres:5432/orders
      DATABASE_USERNAME: orders
      DATABASE_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Gateway de pagamento simulado: lê os comandos de payment.commands e
  # responde em payment.events. Sem porta publicada: só conversa pelo Kafka.
  payment-mock:
    build:
      context: ../services/payment-mock
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: payment-mock
      PORT: "3002"
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://payments@postgres:5432/payments
      DATABASE_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      # Fração dos pagamentos recusados e dos estornos que falham (0 a 1). O
      # experimento de caos "payment-mock recusando 30%" usa 0.3.
      DECLINE_RATE: ${PAYMENT_MOCK_DECLINE_RATE:-0}
      REFUND_FAILURE_RATE: ${PAYMENT_MOCK_REFUND_FAILURE_RATE:-0}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Carga de dados fictícios. Não sobe com o ambiente: roda com `make seed`.
  seed:
    image: node:24-alpine
    profiles: [seed]
    working_dir: /seed
    command: ["node", "seed.mjs"]
    volumes:
      - ../seed:/seed:ro
    environment:
      GATEWAY_URL: http://api-gateway:8080
      KEYCLOAK_URL: http://keycloak:8080
      SEED_CLIENT_SECRET: ${SEED_CLIENT_SECRET:-lotou-seed-dev-secret}
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Verificação do ambiente: faz uma compra de ponta a ponta e confere os
  # traces no Tempo. Roda com `make smoke`.
  smoke:
    image: node:24-alpine
    profiles: [smoke]
    working_dir: /scripts
    command: ["node", "smoke.mjs"]
    volumes:
      - ../scripts:/scripts:ro
    environment:
      WEB_URL: http://web
      KEYCLOAK_URL: http://keycloak:8080
      GRAFANA_URL: http://lgtm:3000
    depends_on:
      web:
        condition: service_healthy

  # Testes de carga (k6). Não sobem com o ambiente: rodam com `make load-*`.
  k6:
    image: grafana/k6:2.4.0
    profiles: [load]
    working_dir: /load-tests
    volumes:
      - ../load-tests:/load-tests:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      EVENT_SERVICE_URL: http://event-service:3000
      INVENTORY_URL: http://inventory-service:8082
      GATEWAY_URL: http://api-gateway:8080
      # Métricas do k6 no Prometheus do Grafana, junto com as dos serviços.
      K6_PROMETHEUS_RW_SERVER_URL: http://lgtm:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max

  # ---------------------------------------------------------------- dados
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lotou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotou}
      POSTGRES_DB: postgres
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Replica set de um nó só: é o que libera transações no MongoDB, que o
  # event-service usa para gravar o show e o outbox juntos. O healthcheck inicia
  # o replica set na primeira subida. Fora do Compose, conecte com
  # directConnection=true (o membro se anuncia como mongodb:27017).
  mongodb:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
      interval: 5s
      timeout: 5s
      retries: 30

  # Kafka em modo KRaft (sem ZooKeeper), um broker só. Os serviços falam com
  # kafka:9092; do host, use localhost:9094.
  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Os tópicos são criados pelo kafka-init, com partições e retenção
      # definidas; um nome digitado errado não cria um tópico novo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Cria os tópicos (contracts/README.md) e termina. Pode rodar de novo.
  kafka-init:
    image: apache/kafka:4.2.0
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVER: kafka:9092
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    # A imagem traz um healthcheck de broker, que não vale para um job.
    healthcheck:
      disable: true
    depends_on:
      kafka:
        condition: service_healthy

  # Painel do Kafka: tópicos, mensagens e lag dos consumer groups.
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: lotou
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Cache: pode perder dados. Descarta por LRU e não persiste nada.
  redis-cache:
    image: redis:8.8-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    healthcheck: &redis-healthcheck
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Estado quente (estoque, assentos, fila): não pode perder dados.
  # Nunca descarta chave e grava AOF a cada segundo.
  redis-core:
    image: redis:8.8-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6380:6379"
    volumes:
      - redis-core-data:/data
    healthcheck: *redis-healthcheck

  # ------------------------------------------------------------ identidade
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # O emissor dos tokens é sempre a URL que o navegador enxerga, mesmo
      # quando um serviço fala com o Keycloak pela rede interna do Compose.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/lotou-realm.json:/opt/keycloak/data/import/lotou-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl: o teste abre um socket na porta de management.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # -------------------------------------------------------- observabilidade
  # Todos os serviços exportam para o Collector, que mascara dados pessoais
  # e repassa para o Tempo, o Prometheus e o Loki.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      lgtm:
        condition: service_healthy

  # Tempo, Prometheus, Loki e Grafana num container só (desenvolvimento).
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  mongodb-data:
  kafka-data:
  redis-core-data:
  lgtm-data:
