name: smoke

# O ambiente inteiro numa máquina limpa: sobe o Compose, roda o seed e confere
# que uma compra de ponta a ponta funciona e que os traces chegam completos ao Tempo.
# Roda quando muda algo que entra no ambiente.
on:
  push:
    paths:
      - apps/**
      - services/**
      - infra/**
      - seed/**
      - scripts/**
      - compose.yaml
      - Makefile
      - .github/workflows/smoke.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o ambiente
        run: make up
      - name: Carrega os dados fictícios
        run: make seed
      - name: Confere loja, API e trace
        run: make smoke
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Derruba o ambiente
        if: always()
        run: make clean
