name: inventory-service

# Só roda quando o serviço (ou este workflow) muda.
on:
  push:
    paths:
      - services/inventory-service/**
      # Os testes de contrato leem contracts/.
      - contracts/**
      - .github/workflows/inventory-service.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Os testes de integração e de concorrência usam um Postgres real (Testcontainers).
      - name: Build e testes
        run: ./mvnw -B verify
