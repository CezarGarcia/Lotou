name: order-service

# Roda quando o serviço muda, e também quando o inventory-service muda: os testes de ponta a
# ponta do checkout rodam o inventory de verdade, a partir da imagem Docker dele.
on:
  push:
    paths:
      - services/order-service/**
      - services/inventory-service/**
      # Os testes de contrato leem contracts/.
      - contracts/**
      - .github/workflows/order-service.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Imagem do inventory-service
        run: docker compose build inventory-service
      - name: Build e testes
        working-directory: services/order-service
        run: ./mvnw -B verify
