name: api-gateway

# Só roda quando o serviço muda. O realm do Keycloak entra no filtro porque o
# teste de integração sobe um Keycloak real com esse arquivo.
on:
  push:
    paths:
      - services/api-gateway/**
      - infra/keycloak/**
      - .github/workflows/api-gateway.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e testes
        run: ./mvnw -B verify
