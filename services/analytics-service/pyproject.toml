[project]
name = "analytics-service"
version = "1.0.0"
description = "Read models do painel do produtor (vendas, relatório financeiro e pedidos), montados a partir dos eventos do Kafka, e o painel ao vivo por WebSocket."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "aiokafka>=0.15",
  "pymongo>=4.20",
  "redis>=8.2",
  "pyjwt[crypto]>=2.15",
  "httpx>=0.29",
  "opentelemetry-api>=1.45",
  "opentelemetry-sdk>=1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-pymongo>=0.66b2",
  "opentelemetry-instrumentation-redis>=0.66b2",
  "opentelemetry-instrumentation-logging>=0.66b2",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.5",
  "ruff>=0.17",
  "mypy>=2.4",
  "jsonschema[format]>=4.26",
  "testcontainers[kafka,mongodb]>=4.15",
  "websockets>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "PT", "C4", "PIE", "RET"]
# Os textos em português usam "º" e afins de propósito; exceções têm nomes de fato
# (ReplayInProgress), sem o sufixo Error.
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["analytics"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: precisa de Docker (Testcontainers)"]
