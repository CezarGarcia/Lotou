server:
  port: ${PORT:8083}
  # Ao receber SIGTERM, termina as requisições em andamento antes de sair.
  shutdown: graceful

spring:
  application:
    name: order-service

  # Uma thread virtual por requisição: esperar o inventory não prende uma thread do sistema.
  threads:
    virtual:
      enabled: true

  # Chamadas a outros serviços: falham rápido em vez de segurar a requisição do comprador.
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 5s

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DATABASE_USERNAME:orders}
    password: ${DATABASE_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}

  jpa:
    # O esquema é do Flyway; o Hibernate só confere se as entidades batem com ele.
    hibernate:
      ddl-auto: validate
    # Sem transação aberta fora do serviço: a conexão volta ao pool assim que a transação termina.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9094}
    producer:
      # Só conta como publicada a mensagem que todas as réplicas gravaram; sem duplicar em retry.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      # Um consumer group novo lê o tópico desde o começo: nada publicado antes da subida se perde.
      auto-offset-reset: earliest
      # O event-service publica o catálogo com transações do Kafka: só lê o que foi confirmado.
      isolation-level: read_committed
    listener:
      # Confirma o offset de cada mensagem logo depois de processada (e gravada no banco).
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          # Emissor esperado no token: a URL pública do realm no Keycloak.
          issuer-uri: ${AUTH_ISSUER:http://localhost:8180/realms/lotou}
          # De onde baixar as chaves públicas (pode ser um endereço interno).
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8180/realms/lotou/protocol/openid-connect/certs}
          audiences: ${AUTH_AUDIENCE:lotou-api}
      client:
        registration:
          # Conta de serviço deste serviço, para chamar os outros (client credentials).
          lotou:
            provider: keycloak
            client-id: ${SERVICE_CLIENT_ID:order-service}
            client-secret: ${SERVICE_CLIENT_SECRET:order-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${AUTH_TOKEN_URI:http://localhost:8180/realms/lotou/protocol/openid-connect/token}

lotou:
  order:
    inventory:
      base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    tickets:
      # Chave do HMAC do QR code dos ingressos (ADR 15). A de desenvolvimento não serve para um ambiente real.
      qr-key: ${TICKET_QR_KEY:lotou-dev-ticket-qr-key}
    saga:
      # Quanto a saga espera a resposta de um passo antes de repetir o comando.
      step-timeout: ${SAGA_STEP_TIMEOUT:15s}
      max-attempts: 5
    refunds:
      # Reembolsos de show cancelado que começam por segundo: não despeja tudo no pagamento de uma vez.
      rate: ${REFUND_RATE:20}
      # Falhas do estorno até o pedido ir para tratamento manual (REFUND_FAILED).
      max-failures: 5
    jobs:
      enabled: ${JOBS_ENABLED:true}
      outbox-interval: ${OUTBOX_INTERVAL:100ms}
      saga-deadline-interval: ${SAGA_DEADLINE_INTERVAL:2s}
      refund-interval: ${REFUND_INTERVAL:1s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
